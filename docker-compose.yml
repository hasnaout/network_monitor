services:

  mysql:
    image: mysql:8.0
    container_name: novos_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE:      ${DB_NAME:-novos_db}
      MYSQL_USER:          ${DB_USER:-novos_user}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-novos_pass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"
    networks:
      - novos_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: novos_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - novos_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: novos_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SECRET_KEY:    ${SECRET_KEY:-change-me-in-production}
      DEBUG:         ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DB_ENGINE:   mysql
      DB_NAME:     ${DB_NAME:-novos_db}
      DB_USER:     ${DB_USER:-novos_user}
      DB_PASSWORD: ${DB_PASSWORD:-novos_pass}
      DB_HOST:     mysql
      DB_PORT:     3306
      CHANNEL_LAYER: redis
      REDIS_HOST:    redis
      REDIS_PORT:    6379
      AGENT_TOKEN: ${AGENT_TOKEN:-change-agent-token-in-production}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL:    ${DJANGO_SUPERUSER_EMAIL:-admin@novopharma.ma}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin1234}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://frontend}
    volumes:
      - static_files:/app/staticfiles
    ports:
      - "8001:8001"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - novos_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_API_URL: ""
        REACT_APP_WS_URL: ""
    container_name: novos_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - novos_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  static_files:
    driver: local

networks:
  novos_network:
    driver: bridge
